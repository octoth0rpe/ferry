# Example ferry config. Run with: ferry -c ferry.toml
#
# Everything is optional except at least one [[proxy]] section.
# Relative paths are resolved against this file's directory.

# Certificate chain and private key (PEM). Leave both out to use a
# certificate from ferry's local CA; the banner links to a page about
# trusting it.
# cert = "/etc/letsencrypt/live/example.com/fullchain.pem"
# key  = "/etc/letsencrypt/live/example.com/privkey.pem"

# Access log: a file path, "-" for stdout (default), or "off".
# access_log = "/var/log/ferry/access.log"

# Error log: a file path or "-" for stderr (default).
# error_log = "/var/log/ferry/error.log"

# Access log format:
#   "combined" (default)  Apache combined, plus duration and request id at the end
#   "common"              Apache common log format
#   "json"                one JSON object per line, with every field
# Timestamps are always ISO 8601 UTC, e.g. 2026-10-16T03:00:00.123Z.
# log_format = "combined"

# Reject request bodies larger than this. Default: unlimited.
# max_body = "10M"

# Write the process id here, and remove it on exit. Default: no pid file.
# (Running in the background is -d, on the command line only.)
# pid_file = "/run/ferry/ferry.pid"

# Redirect plain HTTP sent to an HTTPS port to HTTPS. Default: true.
# (A plain HTTP port that redirects, like 80 -> 443, is listen = "80/443".)
# redirect = true

[[proxy]]
listen = 6005              # or "127.0.0.1:6005", "[::1]:6005", "80/443"
upstream = 6006            # or "10.0.0.5:6006", "http://app:8080", "/run/app.sock"

# [[proxy]]
# listen = 7001
# upstream = "/run/app.sock"
# cert = "other-cert.pem"  # per-listener certificate
# key  = "other-key.pem"
# max_body = "100M"        # per-listener body limit

# Settings almost nobody needs to change. Defaults shown.
# [advanced]
# connect_timeout   = "5s"   # connecting to an upstream
# handshake_timeout = "15s"  # client TLS handshake and request headers
# idle_timeout      = "90s"  # idle keep-alive connections
# shutdown_grace    = "10s"  # in-flight requests on shutdown
# qr_code           = true   # QR codes in the banner for phones (the CA, each app)
# ca_name_constraints = true # limit a new local CA to local names and private
#                            # addresses (applies when the CA is created)
