[package]
name = "ferry"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A very simple HTTPS reverse proxy"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "cargo"] }
hyper = { version = "1.12.0", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "client-legacy", "http1", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.3", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
