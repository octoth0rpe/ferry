[package]
name = "ferry"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A very simple HTTPS reverse proxy"
license = "MIT"
repository = "https://github.com/octoth0rpe/ferry"
readme = "README.md"

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "client-legacy", "http1", "http2"] }
nix = { version = "0.31.3", features = ["net", "hostname", "signal", "process", "fs", "term", "user"] }
qrcodegen = "1.8.0"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
socket2 = "0.6.5"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "io-util", "signal", "time", "sync", "macros", "process"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
futures-core = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["test-util"] }
